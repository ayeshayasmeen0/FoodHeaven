<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - FoodHeaven 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .admin-login-container {
            max-width: 450px;
            width: 90%;
            padding: 2rem;
        }
        
        .admin-login-card {
            background: #2a2a2a;
            border-radius: 30px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
            animation: fadeInUp 0.6s ease;
            border-top: 3px solid #FFD700;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .admin-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .admin-login-card h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #FFD700;
        }
        
        .admin-login-card p {
            color: #aaa;
            margin-bottom: 2rem;
        }
        
        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #ddd;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: #1a1a1a;
            border: 2px solid #3a3a3a;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255,215,0,0.2);
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #FFD700, #E6BE00);
            color: black;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255,215,0,0.3);
        }
        
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #FFD700;
            text-decoration: none;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="admin-login-container" data-aos="fade-up">
        <div class="admin-login-card">
            <div class="admin-icon">👑</div>
            <h1>Admin Portal</h1>
            <p>Enter your credentials to access dashboard</p>
            
            {% if error %}
            <div class="error-message">
                ⚠️ {{ error }}
            </div>
            {% endif %}
            
            <form method="POST" action="/admin/login">
                <div class="input-group">
                    <label>📧 Email Address</label>
                    <input type="email" name="email" required placeholder="admin@foodheaven.com">
                </div>
                
                <div class="input-group">
                    <label>🔒 Password</label>
                    <input type="password" name="password" required placeholder="Enter password">
                </div>
                
                <button type="submit" class="login-btn">
                    🔐 Login to Admin Panel
                </button>
            </form>
            
            <a href="/" class="back-link">← Back to Website</a>
        </div>
    </div>
    
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000 });
    </script>
</body>
</html>
